<!-- ================= Main Content ================= -->


<div class="main-content">


<header class="top-navbar">


<div class="container-fluid">


<div class="navbar-content">


<div class="navbar-left">


<button class="sidebar-toggle">

<i class="fas fa-bars"></i>

</button>


</div>




<div class="navbar-center">


<h4>
Device Settings
</h4>


</div>




<div class="navbar-right">


<button class="icon-btn">

<i class="fas fa-user-circle"></i>

</button>


</div>



</div>


</div>


</header>





<!-- ================= Content ================= -->


<main class="content-area">


<div class="container-fluid">



<div class="page-header mb-4">


<h2 class="page-title">

<i class="fas fa-cog me-2"></i>

Device Settings

</h2>


<p class="page-subtitle">

Manage your Sentinel X wearable settings and safety preferences.

</p>


</div>






<!-- Device Information -->


<div class="settings-card">


<div class="card-header">

<h5>

<i class="fas fa-microchip me-2"></i>

Device Information

</h5>

</div>



<div class="card-body">


<div class="row">


<div class="col-md-6 mb-3">


<label class="form-label">
Device Name
</label>


<input type="text"
class="form-control"
id="deviceName"
placeholder="Sentinel X Wearable">


</div>




<div class="col-md-6 mb-3">


<label class="form-label">
Device ID
</label>


<input type="text"
class="form-control"
id="deviceId"
placeholder="Fetching Device ID..."
readonly>


</div>




<div class="col-md-6 mb-3">


<label class="form-label">
Connection Status
</label>


<input type="text"
class="form-control"
id="deviceStatus"
value="Disconnected"
readonly>


</div>



</div>


</div>


</div>






<!-- Safety Settings -->


<div class="settings-card mt-4">


<div class="card-header">

<h5>

<i class="fas fa-shield-alt me-2"></i>

Safety Settings

</h5>

</div>



<div class="card-body">



<div class="form-check form-switch mb-3">


<input class="form-check-input"
type="checkbox"
id="autoSOS">


<label class="form-check-label">

Auto SOS Detection

</label>


</div>




<div class="form-check form-switch mb-3">


<input class="form-check-input"
type="checkbox"
id="fallDetection">


<label class="form-check-label">

Fall Detection

</label>


</div>



<div class="mb-3">


<label class="form-label">

SOS Countdown Timer (Seconds)

</label>


<input type="number"
class="form-control"
id="sosTimer"
value="10">


</div>



</div>


</div>






<!-- Alert Settings -->


<div class="settings-card mt-4">


<div class="card-header">

<h5>

<i class="fas fa-bell me-2"></i>

Alert Settings

</h5>


</div>



<div class="card-body">


<div class="mb-3">


<label class="form-label">

Emergency Message

</label>


<textarea class="form-control"
id="emergencyMessage"
rows="3">

I need help. This is an emergency alert.

</textarea>


</div>




<div class="form-check form-switch">


<input class="form-check-input"
type="checkbox"
id="alertSound"
checked>


<label class="form-check-label">

Alert Sound

</label>


</div>


</div>


</div>






<button class="btn btn-primary mt-4"
id="saveSettings">


<i class="fas fa-save me-2"></i>

Save Settings

</button>





</div>


</main>


</div>


</div>





<!-- Firebase -->

<script type="module" src="firebase-config.js"></script>

</body>
